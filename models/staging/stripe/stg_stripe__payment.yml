models:
- name: stg_stripe__payment
  description: This model consolidates payment information from Stripe, providing
    a comprehensive view of payment transactions, including details such as payment
    method, status, and amount.
  columns:
  - name: payment_id
    description: A unique identifier for each payment transaction.
  - name: order_id
    description: The identifier for the order associated with the payment.
  - name: payment_method
    description: The method used to make the payment, such as credit card or bank
      transfer.
  - name: payment_status
    description: The current status of the payment, indicating whether it is completed,
      pending, or failed.
  - name: payment_amount
    description: The total amount of the payment transaction.
  - name: payment_created
    description: The date when the payment was created.
  - name: _batched_at
    description: The timestamp indicating when the payment data was batched.
